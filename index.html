        <title>Tigrigna Bible · ወንጌል ቅዱስ</title>
        <meta name="description" content="Read, search, and save the Tigrigna Bible offline. Installable app with focused reading, highlights, notes, reading plans and fast search."/>
        <meta name="theme-color" content="#f7e9d6"/>
        <meta name="color-scheme" content="light dark"/>
        <script>
            (function () {
                try {
                    var cache = JSON.parse(localStorage.getItem('tb-theme-cache-v3') || 'null');
                    if (!cache) return;
                    var entry = cache.mode === 'system'
                        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? cache.dark : cache.light)
                        : cache.fixed;
                    if (!entry || !entry.vars) return;
                    var root = document.documentElement;
                    for (var key in entry.vars) root.style.setProperty(key, entry.vars[key]);
                    root.dataset.theme = entry.id;
                    root.dataset.tier = entry.tier;
                    root.style.colorScheme = entry.scheme;
                    if (entry.meta) document.querySelector('meta[name="theme-color"]').content = entry.meta;
                } catch (e) {}
            })();
        </script>
